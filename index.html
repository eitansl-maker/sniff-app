<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>סניף</title>
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=4">
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--blue:#1a73e8;--blue-soft:#e8f0fe;--red:#d93025;--red-soft:#fce8e6;--green:#188038;--radius:16px}
@media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#222;--text:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--blue-soft:#2a3550;--red:#f28b82;--red-soft:#42201e;--green:#81c995}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans","Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--text)}
.logo img{width:32px;height:32px}
.branch{flex:1;font-size:13px;color:var(--muted);line-height:1.3}
.branch b{color:var(--text);font-size:14px}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:6px 16px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search input{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;padding:8px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card h3{margin:0 0 2px;font-size:19px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px}
.card p{margin:8px 0 0;font-size:14px}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:12px;margin-inline-start:6px}
.badge.off{background:var(--red-soft);color:var(--red);font-weight:600}
.card.off{border-color:var(--red);background:var(--red-soft)}
.card.off h3{color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:1px 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
.panel.off{border-color:var(--red)}
.panel h2{margin:0 0 4px}
.panel ul{padding-inline-start:20px;margin:8px 0}
.model{border-top:1px solid var(--line);padding:10px 0}
.model b{font-size:15px}
.back{border:0;background:none;color:var(--blue);font:inherit;cursor:pointer;padding:4px 0}
.hint{color:var(--muted);font-size:13px;margin:8px 4px}
.result{margin-top:10px}
.score{font-size:12px;color:var(--muted)}
.stage{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.stage .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:6px 4px}
.gate{text-align:center}.chip.big{font-size:16px;padding:10px 24px;background:var(--blue);color:#fff;border-color:var(--blue)}img.avatar{object-fit:cover}
.call{margin-inline-start:6px;color:var(--blue);text-decoration:none;font-size:13px}.row{padding:6px 0;border-top:1px solid var(--line)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.form input,.form select,#hrday{font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}details{margin-top:10px}.seg{display:flex;gap:8px;margin:12px 0}.seg .chip{flex:1}.mode{display:flex;flex-direction:column;gap:8px;margin:8px 0}.mode label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.mode input,.mode select{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}.chip.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:560px){.two{grid-template-columns:1fr}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <div class="logo"><img src="icons/icon.svg?v=4" alt=""><span id="appName">סניף</span><small id="ver" style="font-weight:400;font-size:11px;color:var(--muted);align-self:flex-end"></small></div>
  <div class="branch" id="branchBox"></div>
  <div class="user" id="userBox"></div>
</header>
<nav id="tabs">
  <button data-t="search" class="on">חיפוש חכם</button>
  <button data-t="brands">מותגים</button>
  <button data-t="sales">עקרונות מכירה</button>
  <button data-t="hr">כוח אדם</button>
</nav>
<div id="gate" hidden style="max-width:520px;margin:40px auto;padding:16px"></div>
<main id="view"></main>
<footer>סניף · מידע מקצועי לצוות · שלב 1</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
